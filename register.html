<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOKIPICK — Register</title>
  <link rel="icon" href="assets/iconA.png" type="image/png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-header"><img src="assets/iconA.png" alt="TOKIPICK" style="width:34px; height:34px; border-radius:50%; object-fit:cover;" /></div>

    <div class="auth-card">
      <div class="card-header">
        <img src="assets/logoA.png" alt="TOKIPICK" style="max-width:150px; margin:0 auto; display:block;" />
      </div>

      <form action="home.html" data-register-form novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Value" />
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Value" />
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="pass">Password</label>
          <input type="password" id="pass" placeholder="Value" />
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="pass2">Verify password</label>
          <input type="password" id="pass2" placeholder="Value" />
          <div class="field-error"></div>
        </div>
        <button type="submit" class="btn-primary">Register</button>
      </form>

      <div class="auth-links" style="padding-top:0;">
        Already have an account? <a href="login.html">Sign in →</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
